<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadSync - Customer Management Portal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // =========================================================================
    // 🔗 YOUR GOOGLE APPS SCRIPT WEB APP URL
    // =========================================================================
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyJe2StAZroU5Oo5RNYgNQ8il_dyZIxZjyDCVof_DqUPiUs-I9gXUTU-VHP38Ji8mwH/exec";

    // Initial Users List with Super Admin Rashik
    const INITIAL_USERS = [
      { username: 'rashik', password: '215893', name: 'Rashik (Super Admin)', role: 'admin' },
     
    ];

    const LEAD_SOURCES = [
      'Facebook',
      'Instagram',
      'TikTok',
      'WhatsApp',
      'Direct Call',
      'Google Search',
      'Others'
    ];

    function App() {
      // Dynamic User State (Load from localStorage if available)
      const [users, setUsers] = useState(() => {
        const savedUsers = localStorage.getItem('leadsync_users');
        return savedUsers ? JSON.parse(savedUsers) : INITIAL_USERS;
      });

      const [currentUser, setCurrentUser] = useState(null);
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      const [customers, setCustomers] = useState([]);
      const [loading, setLoading] = useState(false);
      const [activeTab, setActiveTab] = useState('add');
      
      const [searchQuery, setSearchQuery] = useState('');
      
      const [formData, setFormData] = useState({
        name: '',
        phone: '',
        age: '',
        profession: '',
        source: 'Facebook'
      });
      const [formAlert, setFormAlert] = useState(null);

      const [adminUserFilter, setAdminUserFilter] = useState('all');
      const [adminSourceFilter, setAdminSourceFilter] = useState('all');

      // State for adding new user by Admin
      const [newUserForm, setNewUserForm] = useState({
        name: '',
        username: '',
        password: '',
        role: 'member'
      });
      const [userAlert, setUserAlert] = useState(null);

      // Save users to localStorage whenever updated
      useEffect(() => {
        localStorage.setItem('leadsync_users', JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentUser, activeTab, customers, searchQuery, formAlert, loginError, users, userAlert]);

      const fetchCustomers = async () => {
        if (!GOOGLE_SHEET_API_URL) return;
        setLoading(true);
        try {
          const response = await fetch(GOOGLE_SHEET_API_URL);
          const data = await response.json();
          if (Array.isArray(data)) {
            setCustomers(data);
          }
        } catch (error) {
          console.error("Failed to load customer data from Google Sheets:", error);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (currentUser) {
          fetchCustomers();
        }
      }, [currentUser]);

      const duplicateMatches = useMemo(() => {
        const query = searchQuery.trim().toLowerCase();
        if (!query) return [];
        return customers.filter(c => 
          (c.Phone && String(c.Phone).toLowerCase().includes(query)) ||
          (c.Name && String(c.Name).toLowerCase().includes(query))
        );
      }, [searchQuery, customers]);

      const isFormPhoneDuplicate = useMemo(() => {
        const cleanPhone = formData.phone.trim();
        if (!cleanPhone || cleanPhone.length < 5) return null;
        return customers.find(c => String(c.Phone).trim() === cleanPhone);
      }, [formData.phone, customers]);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');

        const foundUser = users.find(
          u => u.username.toLowerCase() === loginUsername.trim().toLowerCase() && u.password === loginPassword
        );

        if (foundUser) {
          setCurrentUser(foundUser);
          if (foundUser.role === 'admin') {
            setActiveTab('admin_analytics');
          } else {
            setActiveTab('add');
          }
          setLoginUsername('');
          setLoginPassword('');
        } else {
          setLoginError('Invalid Username or Password. Please try again.');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setCustomers([]);
        setLoginError('');
      };

      const handleAddUser = async (e) => {
        e.preventDefault();
        setUserAlert(null);

        if (!newUserForm.name || !newUserForm.username || !newUserForm.password) {
          setUserAlert({ type: 'error', message: 'All fields are required.' });
          return;
        }

        const usernameExists = users.some(
          u => u.username.toLowerCase() === newUserForm.username.trim().toLowerCase()
        );

        if (usernameExists) {
          setUserAlert({ type: 'error', message: 'Username already exists! Choose a different username.' });
          return;
        }

        const newUser = {
          name: newUserForm.name.trim(),
          username: newUserForm.username.trim(),
          password: newUserForm.password,
          role: newUserForm.role
        };

        try {
          await fetch(GOOGLE_SHEET_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'addUser', ...newUser })
          });
        } catch (err) {
          console.error("User save to Google Sheet error:", err);
        }

        setUsers([...users, newUser]);
        setUserAlert({ type: 'success', message: `New ${newUser.role.toUpperCase()} "${newUser.name}" added successfully!` });
        setNewUserForm({ name: '', username: '', password: '', role: 'member' });
      };

      const handleDeleteUser = (usernameToDelete) => {
        if (usernameToDelete === currentUser.username) {
          alert("You cannot delete your own logged-in account!");
          return;
        }
        if (confirm(`Are you sure you want to delete user "${usernameToDelete}"?`)) {
          setUsers(users.filter(u => u.username !== usernameToDelete));
        }
      };

      const handleFormSubmit = async (e) => {
        e.preventDefault();
        if (!formData.name || !formData.phone) {
          setFormAlert({ type: 'error', message: 'Name and Phone number are required fields.' });
          return;
        }

        if (isFormPhoneDuplicate) {
          setFormAlert({ 
            type: 'error', 
            message: `Duplicate phone number! Customer already added by ${isFormPhoneDuplicate.AddedBy || 'another team member'}.` 
          });
          return;
        }

        setLoading(true);
        setFormAlert(null);

        const newRecord = {
          id: Date.now().toString(),
          name: formData.name.trim(),
          phone: formData.phone.trim(),
          age: formData.age || 'N/A',
          profession: formData.profession || 'N/A',
          source: formData.source,
          addedBy: currentUser.name,
          createdAt: new Date().toISOString()
        };

        try {
          await fetch(GOOGLE_SHEET_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(newRecord)
          });

          setFormAlert({ type: 'success', message: 'Customer details saved successfully to Google Sheet!' });
          setFormData({ name: '', phone: '', age: '', profession: '', source: 'Facebook' });
          fetchCustomers();
        } catch (err) {
          console.error(err);
          setFormAlert({ type: 'error', message: 'Failed to submit data. Please check your network connection or Apps Script setup.' });
        } finally {
          setLoading(false);
        }
      };

      const getAnalytics = (userFilter = 'all') => {
        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];
        const oneWeekAgo = new Date();
        oneWeekAgo.setDate(now.getDate() - 7);

        const filtered = userFilter === 'all' 
          ? customers 
          : customers.filter(c => c.AddedBy === userFilter);

        const todayCount = filtered.filter(c => {
          if (!c.ID) return false;
          const d = new Date(Number(c.ID));
          return d.toISOString().split('T')[0] === todayStr;
        }).length;

        const weeklyCount = filtered.filter(c => {
          if (!c.ID) return false;
          const d = new Date(Number(c.ID));
          return d >= oneWeekAgo;
        }).length;

        return {
          total: filtered.length,
          today: todayCount,
          weekly: weeklyCount
        };
      };

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-slate-800 rounded-2xl p-8 border border-slate-700 shadow-2xl">
              <div className="text-center mb-8">
                <div className="inline-flex items-center justify-center p-3 bg-blue-600/20 text-blue-400 rounded-xl mb-3">
                  <i data-lucide="users" className="w-9 h-9"></i>
                </div>
                <h1 className="text-2xl font-bold">LeadSync Portal</h1>
                <p className="text-slate-400 text-sm mt-1">Log in to access your dashboard</p>
              </div>

              {loginError && (
                <div className="mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl text-sm flex items-center gap-2">
                  <i data-lucide="alert-circle" className="w-4 h-4 shrink-0"></i>
                  <span>{loginError}</span>
                </div>
              )}

              <form onSubmit={handleLoginSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Username</label>
                  <input
                    type="text"
                    placeholder="e.g. rashik or rahim"
                    value={loginUsername}
                    onChange={(e) => setLoginUsername(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500 text-sm"
                    required
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Password</label>
                  <input
                    type="password"
                    placeholder="Enter password"
                    value={loginPassword}
                    onChange={(e) => setLoginPassword(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500 text-sm"
                    required
                  />
                </div>

                <button
                  type="submit"
                  className="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 text-sm mt-2"
                >
                  <i data-lucide="log-in" className="w-4 h-4"></i> Login
                </button>
              </form>

              <div className="mt-6 pt-4 border-t border-slate-700/60 text-xs text-slate-400 space-y-1">
                <div className="font-semibold text-slate-300 mb-1">Super Admin Login:</div>
                <div className="flex justify-between"><span>Super Admin:</span> <code className="text-purple-300 font-bold">rashik / 0000</code></div>
              </div>
            </div>
          </div>
        );
      }

      const myData = customers.filter(c => c.AddedBy === currentUser.name);

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
          <header className="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="bg-blue-600 p-2 rounded-lg text-white">
                  <i data-lucide="users" className="w-5 h-5"></i>
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight">LeadSync Portal</h1>
                  <p className="text-xs text-slate-400">Google Sheets Connected</p>
                </div>
              </div>

              <div className="flex items-center gap-4">
                <button
                  onClick={fetchCustomers}
                  disabled={loading}
                  className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-700 transition-all"
                  title="Refresh Data"
                >
                  <i data-lucide="refresh-cw" className={`w-4 h-4 ${loading ? "animate-spin" : ""}`}></i>
                </button>

                <div className="flex items-center gap-2 bg-slate-700/50 px-3 py-1.5 rounded-lg border border-slate-600">
                  <i data-lucide={currentUser.role === 'admin' ? "shield" : "user"} className={`w-4 h-4 ${currentUser.role === 'admin' ? "text-purple-400" : "text-blue-400"}`}></i>
                  <span className="text-sm font-medium">{currentUser.name}</span>
                </div>

                <button
                  onClick={handleLogout}
                  className="p-2 text-red-400 hover:bg-red-500/10 rounded-lg transition-all"
                  title="Log Out"
                >
                  <i data-lucide="log-out" className="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </header>

          <div className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
            <div className="flex gap-2 border-b border-slate-700 pb-3 overflow-x-auto">
              {currentUser.role === 'member' && (
                <>
                  <button
                    onClick={() => setActiveTab('add')}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                      activeTab === 'add' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                    }`}
                  >
                    <i data-lucide="user-plus" className="w-4 h-4"></i> Add Customer
                  </button>

                  <button
                    onClick={() => setActiveTab('search')}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                      activeTab === 'search' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                    }`}
                  >
                    <i data-lucide="search" className="w-4 h-4"></i> Check Duplication
                  </button>

                  <button
                    onClick={() => setActiveTab('my_data')}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                      activeTab === 'my_data' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                    }`}
                  >
                    <i data-lucide="file-spreadsheet" className="w-4 h-4"></i> My Entries ({myData.length})
                  </button>
                </>
              )}

              {currentUser.role === 'admin' && (
                <>
                  <button
                    onClick={() => setActiveTab('admin_analytics')}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                      activeTab === 'admin_analytics' ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                    }`}
                  >
                    <i data-lucide="bar-chart-3" className="w-4 h-4"></i> Team Status & Analytics
                  </button>

                  <button
                    onClick={() => setActiveTab('admin_all')}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                      activeTab === 'admin_all' ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                    }`}
                  >
                    <i data-lucide="users" className="w-4 h-4"></i> Manage All Data ({customers.length})
                  </button>

                  <button
                    onClick={() => setActiveTab('admin_users')}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                      activeTab === 'admin_users' ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                    }`}
                  >
                    <i data-lucide="user-cog" className="w-4 h-4"></i> User Management ({users.length})
                  </button>
                </>
              )}
            </div>

            {activeTab === 'add' && currentUser.role === 'member' && (
              <div className="max-w-2xl mx-auto bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-lg">
                <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                  <i data-lucide="user-plus" className="text-blue-400 w-5 h-5"></i> Add New Customer Detail
                </h2>

                {formAlert && (
                  <div className={`p-4 rounded-xl mb-4 text-sm flex items-start gap-3 ${
                    formAlert.type === 'error' 
                      ? 'bg-red-500/10 border border-red-500/30 text-red-300' 
                      : 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-300'
                  }`}>
                    <i data-lucide={formAlert.type === 'error' ? "alert-triangle" : "check-circle"} className="shrink-0 w-5 h-5"></i>
                    <div>{formAlert.message}</div>
                  </div>
                )}

                <form onSubmit={handleFormSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Phone Number *</label>
                    <input
                      type="text"
                      placeholder="e.g. 01712345678"
                      value={formData.phone}
                      onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500"
                      required
                    />
                    {isFormPhoneDuplicate && (
                      <p className="text-xs text-red-400 mt-1 flex items-center gap-1">
                        <i data-lucide="alert-triangle" className="w-3 h-3"></i> Already added by: <strong>{isFormPhoneDuplicate.AddedBy}</strong>
                      </p>
                    )}
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Customer Full Name *</label>
                    <input
                      type="text"
                      placeholder="e.g. John Doe"
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Age</label>
                      <input
                        type="number"
                        placeholder="e.g. 28"
                        value={formData.age}
                        onChange={(e) => setFormData({ ...formData, age: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Profession</label>
                      <input
                        type="text"
                        placeholder="e.g. Engineer"
                        value={formData.profession}
                        onChange={(e) => setFormData({ ...formData, profession: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Source Platform</label>
                    <select
                      value={formData.source}
                      onChange={(e) => setFormData({ ...formData, source: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500"
                    >
                      {LEAD_SOURCES.map(src => (
                        <option key={src} value={src}>{src}</option>
                      ))}
                    </select>
                  </div>

                  <button
                    type="submit"
                    disabled={loading || Boolean(isFormPhoneDuplicate)}
                    className="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 text-white font-semibold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2"
                  >
                    <i data-lucide={loading ? "refresh-cw" : "user-plus"} className={`w-4 h-4 ${loading ? "animate-spin" : ""}`}></i> Save to Google Sheet
                  </button>
                </form>
              </div>
            )}

            {activeTab === 'search' && (
              <div className="space-y-4">
                <div className="bg-slate-800 rounded-2xl p-6 border border-slate-700">
                  <h2 className="text-xl font-bold mb-2 flex items-center gap-2">
                    <i data-lucide="search" className="text-blue-400 w-5 h-5"></i> Duplication Search Engine
                  </h2>
                  <p className="text-slate-400 text-sm mb-4">
                    Type a phone number or name to search across the entire database before adding a lead.
                  </p>

                  <div className="relative">
                    <input
                      type="text"
                      placeholder="Search by phone number or name..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500"
                    />
                  </div>
                </div>

                {searchQuery.trim() !== '' && (
                  <div className="space-y-3">
                    <div className="text-sm text-slate-400">
                      Search Results for "<span className="text-white">{searchQuery}</span>":
                    </div>

                    {duplicateMatches.length === 0 ? (
                      <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-6 text-center text-emerald-300">
                        <i data-lucide="check-circle" className="mx-auto mb-2 text-emerald-400 w-8 h-8"></i>
                        <h3 className="font-bold">No Duplicates Found!</h3>
                        <p className="text-sm text-emerald-400/80 mt-1">This customer is clear to be added to the system.</p>
                      </div>
                    ) : (
                      <div className="bg-red-500/10 border border-red-500/30 rounded-xl p-4">
                        <div className="flex items-center gap-2 text-red-400 font-bold mb-3">
                          <i data-lucide="alert-triangle" className="w-5 h-5"></i>
                          Found {duplicateMatches.length} Matching Customer(s) in System
                        </div>

                        <div className="space-y-2">
                          {duplicateMatches.map((item, idx) => (
                            <div key={idx} className="bg-slate-900 p-4 rounded-lg border border-slate-700 flex flex-wrap justify-between items-center gap-2">
                              <div>
                                <div className="font-bold text-white">{item.Name}</div>
                                <div className="text-sm text-slate-400 flex items-center gap-3 mt-1">
                                  <span>Phone: {item.Phone}</span>
                                  <span>Source: {item.Source}</span>
                                  <span>Profession: {item.Profession}</span>
                                </div>
                              </div>
                              <div className="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-xs text-purple-300">
                                Added by: <strong>{item.AddedBy}</strong>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'my_data' && currentUser.role === 'member' && (
              <div className="bg-slate-800 rounded-2xl p-6 border border-slate-700">
                <h2 className="text-xl font-bold mb-4">My Added Customers ({myData.length})</h2>

                {myData.length === 0 ? (
                  <p className="text-slate-400 text-center py-8">You haven't added any customer records yet.</p>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-slate-300">
                      <thead className="bg-slate-900 text-xs uppercase text-slate-400">
                        <tr>
                          <th className="p-3">Name</th>
                          <th className="p-3">Phone</th>
                          <th className="p-3">Age</th>
                          <th className="p-3">Profession</th>
                          <th className="p-3">Source</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-700">
                        {myData.map((item, idx) => (
                          <tr key={idx} className="hover:bg-slate-700/40">
                            <td className="p-3 font-medium text-white">{item.Name}</td>
                            <td className="p-3">{item.Phone}</td>
                            <td className="p-3">{item.Age}</td>
                            <td className="p-3">{item.Profession}</td>
                            <td className="p-3"><span className="bg-slate-700 px-2 py-1 rounded text-xs">{item.Source}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'admin_analytics' && currentUser.role === 'admin' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                    <div className="flex justify-between items-center text-slate-400 mb-2">
                      <span className="text-xs uppercase font-semibold">Total System Records</span>
                      <i data-lucide="file-spreadsheet" className="text-blue-400 w-5 h-5"></i>
                    </div>
                    <div className="text-3xl font-bold text-white">{getAnalytics('all').total}</div>
                  </div>

                  <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                    <div className="flex justify-between items-center text-slate-400 mb-2">
                      <span className="text-xs uppercase font-semibold">Today's Total Intake</span>
                      <i data-lucide="clock" className="text-emerald-400 w-5 h-5"></i>
                    </div>
                    <div className="text-3xl font-bold text-emerald-400">{getAnalytics('all').today}</div>
                  </div>

                  <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                    <div className="flex justify-between items-center text-slate-400 mb-2">
                      <span className="text-xs uppercase font-semibold">Weekly Intake</span>
                      <i data-lucide="trending-up" className="text-purple-400 w-5 h-5"></i>
                    </div>
                    <div className="text-3xl font-bold text-purple-400">{getAnalytics('all').weekly}</div>
                  </div>
                </div>

                <div className="bg-slate-800 rounded-2xl p-6 border border-slate-700">
                  <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="bar-chart-3" className="text-purple-400 w-5 h-5"></i> Member Performance Status
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {users.filter(u => u.role === 'member').map(member => {
                      const stats = getAnalytics(member.name);
                      return (
                        <div key={member.username} className="bg-slate-900 p-5 rounded-xl border border-slate-700 space-y-3">
                          <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                            <span className="font-bold text-slate-200">{member.name}</span>
                            <span className="text-xs bg-slate-800 px-2 py-1 rounded text-slate-400">Member</span>
                          </div>

                          <div className="grid grid-cols-3 gap-2 text-center">
                            <div className="bg-slate-800 p-2 rounded-lg">
                              <div className="text-xs text-slate-400">Today</div>
                              <div className="text-lg font-bold text-emerald-400">{stats.today}</div>
                            </div>
                            <div className="bg-slate-800 p-2 rounded-lg">
                              <div className="text-xs text-slate-400">Weekly</div>
                              <div className="text-lg font-bold text-purple-400">{stats.weekly}</div>
                            </div>
                            <div className="bg-slate-800 p-2 rounded-lg">
                              <div className="text-xs text-slate-400">Total</div>
                              <div className="text-lg font-bold text-white">{stats.total}</div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'admin_all' && currentUser.role === 'admin' && (
              <div className="bg-slate-800 rounded-2xl p-6 border border-slate-700 space-y-4">
                <div className="flex flex-wrap justify-between items-center gap-4">
                  <h2 className="text-xl font-bold">Manage All Customer Records</h2>

                  <div className="flex gap-2">
                    <select
                      value={adminUserFilter}
                      onChange={(e) => setAdminUserFilter(e.target.value)}
                      className="bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-2 text-slate-200"
                    >
                      <option value="all">All Members</option>
                      {users.filter(u => u.role === 'member').map(m => (
                        <option key={m.username} value={m.name}>{m.name}</option>
                      ))}
                    </select>

                    <select
                      value={adminSourceFilter}
                      onChange={(e) => setAdminSourceFilter(e.target.value)}
                      className="bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-2 text-slate-200"
                    >
                      <option value="all">All Sources</option>
                      {LEAD_SOURCES.map(src => (
                        <option key={src} value={src}>{src}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm text-slate-300">
                    <thead className="bg-slate-900 text-xs uppercase text-slate-400">
                      <tr>
                        <th className="p-3">Name</th>
                        <th className="p-3">Phone</th>
                        <th className="p-3">Age</th>
                        <th className="p-3">Profession</th>
                        <th className="p-3">Source</th>
                        <th className="p-3">Added By</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-700">
                      {customers
                        .filter(c => adminUserFilter === 'all' || c.AddedBy === adminUserFilter)
                        .filter(c => adminSourceFilter === 'all' || c.Source === adminSourceFilter)
                        .map((item, idx) => (
                          <tr key={idx} className="hover:bg-slate-700/40">
                            <td className="p-3 font-medium text-white">{item.Name}</td>
                            <td className="p-3">{item.Phone}</td>
                            <td className="p-3">{item.Age}</td>
                            <td className="p-3">{item.Profession}</td>
                            <td className="p-3"><span className="bg-slate-700 px-2 py-1 rounded text-xs">{item.Source}</span></td>
                            <td className="p-3 text-purple-300 font-medium">{item.AddedBy}</td>
                          </tr>
                        ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* USER MANAGEMENT TAB FOR ADMIN */}
            {activeTab === 'admin_users' && currentUser.role === 'admin' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-lg h-fit">
                  <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="user-plus" className="text-purple-400 w-5 h-5"></i> Add New User / Admin
                  </h2>

                  {userAlert && (
                    <div className={`p-3 rounded-xl mb-4 text-xs flex items-start gap-2 ${
                      userAlert.type === 'error' 
                        ? 'bg-red-500/10 border border-red-500/30 text-red-300' 
                        : 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-300'
                    }`}>
                      <i data-lucide={userAlert.type === 'error' ? "alert-triangle" : "check-circle"} className="shrink-0 w-4 h-4"></i>
                      <div>{userAlert.message}</div>
                    </div>
                  )}

                  <form onSubmit={handleAddUser} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Full Name *</label>
                      <input
                        type="text"
                        placeholder="e.g. Tanvir Ahmed"
                        value={newUserForm.name}
                        onChange={(e) => setNewUserForm({ ...newUserForm, name: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-purple-500 text-sm"
                        required
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Username *</label>
                      <input
                        type="text"
                        placeholder="e.g. tanvir"
                        value={newUserForm.username}
                        onChange={(e) => setNewUserForm({ ...newUserForm, username: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-purple-500 text-sm"
                        required
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Password *</label>
                      <input
                        type="password"
                        placeholder="Enter password"
                        value={newUserForm.password}
                        onChange={(e) => setNewUserForm({ ...newUserForm, password: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-purple-500 text-sm"
                        required
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Account Role</label>
                      <select
                        value={newUserForm.role}
                        onChange={(e) => setNewUserForm({ ...newUserForm, role: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-purple-500 text-sm"
                      >
                        <option value="member">Member (Can add lead)</option>
                        <option value="admin">Admin (Full Control)</option>
                      </select>
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 text-sm"
                    >
                      <i data-lucide="user-check" className="w-4 h-4"></i> Create Account
                    </button>
                  </form>
                </div>

                <div className="md:col-span-2 bg-slate-800 rounded-2xl p-6 border border-slate-700">
                  <h2 className="text-xl font-bold mb-4 flex items-center justify-between">
                    <span>System User Accounts ({users.length})</span>
                    <span className="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300 font-normal">Active System Users</span>
                  </h2>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-slate-300">
                      <thead className="bg-slate-900 text-xs uppercase text-slate-400">
                        <tr>
                          <th className="p-3">Display Name</th>
                          <th className="p-3">Username</th>
                          <th className="p-3">Password</th>
                          <th className="p-3">Role</th>
                          <th className="p-3 text-right">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-700">
                        {users.map((u) => (
                          <tr key={u.username} className="hover:bg-slate-700/40">
                            <td className="p-3 font-medium text-white flex items-center gap-2">
                              <i data-lucide={u.role === 'admin' ? "shield" : "user"} className={`w-4 h-4 ${u.role === 'admin' ? "text-purple-400" : "text-blue-400"}`}></i>
                              {u.name}
                            </td>
                            <td className="p-3"><code className="bg-slate-900 px-2 py-0.5 rounded text-xs text-slate-300">{u.username}</code></td>
                            <td className="p-3"><code className="bg-slate-900 px-2 py-0.5 rounded text-xs text-amber-300">{u.password}</code></td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded text-xs uppercase font-bold ${
                                u.role === 'admin' ? 'bg-purple-500/20 text-purple-300 border border-purple-500/30' : 'bg-blue-500/20 text-blue-300 border border-blue-500/30'
                              }`}>
                                {u.role}
                              </span>
                            </td>
                            <td className="p-3 text-right">
                              {u.username !== currentUser.username ? (
                                <button
                                  onClick={() => handleDeleteUser(u.username)}
                                  className="p-1.5 text-red-400 hover:bg-red-500/20 rounded-lg transition-all"
                                  title="Delete User"
                                >
                                  <i data-lucide="trash-2" className="w-4 h-4"></i>
                                </button>
                              ) : (
                                <span className="text-xs text-slate-500 italic">Current User</span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
